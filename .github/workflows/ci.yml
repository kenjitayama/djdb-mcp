# Runs the tests on the Node versions in engines. Not wired to publish.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24.15.0 is the engines floor. 24 and 26 are the latest of each supported major.
        node: ['24.15.0', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  unsupported-node:
    name: unsupported node (${{ matrix.node }}) exits 2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: both binaries refuse with exit 2
        run: |
          for b in djdb djdb-mcp-server; do
            set +e; node "bin/$b" status </dev/null 2>err.txt; code=$?; set -e
            cat err.txt
            test "$code" -eq 2
            grep -q 'Install Node 24' err.txt
          done
