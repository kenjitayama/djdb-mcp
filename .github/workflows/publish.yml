# Draft only. Publishing is Kenji's decision. This workflow never runs on push;
# it is workflow_dispatch only, and the package remains "private": true until that decision.
name: publish
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm a provenance publish of @kenjitayama/djdb-mcp'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: refuse if still private
        run: |
          node -e 'const p=require("./package.json"); if (p.private) { console.error("package.json private is still true; refusing to publish"); process.exit(1); }'
      - name: test
        run: node --test test/*.test.mjs
      - name: publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
